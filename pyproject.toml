[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codescope-local"
version = "1.0.0"
description = "Local-first, multi-language static code diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ggrrrt5543"}]
dependencies = ["fastapi>=0.115,<0.116", "uvicorn>=0.30,<1", "ruff>=0.11,<1", "bandit>=1.8,<2", "pyright>=1.1.400,<2", "tree-sitter>=0.25,<0.26", "tree-sitter-cpp>=0.23,<0.24", "tree-sitter-c-sharp>=0.23,<0.24", "tree-sitter-java>=0.23,<0.24"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
codescope = "codescope.cli:main"

[tool.setuptools.package-data]
codescope = ["static/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
include = ["codescope*"]
